# =============================================================
#  alembic.ini — Configuración principal de Alembic
#  Professor Copilot Database
# =============================================================

[alembic]
# Directorio donde viven env.py y versions/
script_location = migrations

# Template para nombres de archivos de revisión.
# El resultado es: 0001_create_schemas_and_enums.py (se setea manualmente vía --rev-id)
file_template = %%(rev)s_%%(slug)s

# Directorio de versiones (relativo a script_location)
version_locations = %(here)s/migrations/versions

# Timezone para los timestamps en los archivos generados
timezone = UTC

# Truncar el slug largo a 40 caracteres
truncate_slug_length = 40

# La URL real se carga en env.py desde la variable de entorno DATABASE_URL.
# Este valor actúa como fallback explícito que intencionalemente falla
# para forzar el uso del .env
sqlalchemy.url = postgresql://CONFIGURE_VIA_DOT_ENV@localhost/professor_copilot

# ── Logging ───────────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
